name: macOS Package Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-package:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Dmg package
        run: ./gradlew :composeApp:packageDmg --stacktrace

      - name: Verify package
        run: |
          set -euo pipefail
          DMG_FILE="$(find composeApp/build/compose/binaries -name '*.dmg' -print -quit)"

          if [ -z "$DMG_FILE" ]; then
            echo "::error::No .dmg package was produced"
            exit 1
          fi

          echo "Dmg package: $DMG_FILE"
          hdiutil imageinfo "$DMG_FILE" >/dev/null
          echo "DMG_FILE=$DMG_FILE" >> "$GITHUB_ENV"

      - name: Upload Dmg package
        uses: actions/upload-artifact@v4
        with:
          name: stade-dmg
          path: ${{ env.DMG_FILE }}
          if-no-files-found: error

      - name: Sign the installer for the in-app updater
        if: startsWith(github.ref, 'refs/tags/') && env.UPDATE_SIGNING_KEY != ''
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Ed25519 imza, kurulum dosyasinin SHA-256 ozetinin uzerine atilir.
          # JDK kullanilir; macOS kosucusundaki LibreSSL Ed25519 desteklemiyor.
          for FILE in "$DMG_FILE"; do
            [ -n "$FILE" ] || continue
            java .github/scripts/UpdateSigner.java sign "$FILE"
          done

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"

          # Release Notes iş akışı sürümü paralel olarak oluşturur; hazır olmasını bekle
          for attempt in $(seq 1 20); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            echo "Release $TAG henüz yok; bekleniyor ($attempt/20)"
            sleep 15
          done

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG için bir sürüm bulunamadı, kurulum dosyası eklenemedi"
            exit 1
          fi

          gh release upload "$TAG" "$DMG_FILE" ${DMG_FILE}.sig --repo "$GITHUB_REPOSITORY" --clobber 2>/dev/null || gh release upload "$TAG" "$DMG_FILE" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Eklendi: $DMG_FILE -> $TAG"
