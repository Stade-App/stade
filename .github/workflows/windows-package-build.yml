name: Windows Package Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Build Exe package
        shell: bash
        run: ./gradlew :composeApp:packageExe --stacktrace

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          EXE_FILE="$(find composeApp/build/compose/binaries -name '*.exe' -print -quit)"

          if [ -z "$EXE_FILE" ]; then
            echo "::error::No .exe package was produced"
            exit 1
          fi

          echo "Exe package: $EXE_FILE"
          echo "EXE_FILE=$EXE_FILE" >> "$GITHUB_ENV"

      - name: Upload Exe package
        uses: actions/upload-artifact@v4
        with:
          name: stade-exe
          path: ${{ env.EXE_FILE }}
          if-no-files-found: error

      - name: Sign the installer for the in-app updater
        if: startsWith(github.ref, 'refs/tags/') && env.UPDATE_SIGNING_KEY != ''
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Ed25519 imza, kurulum dosyasinin SHA-256 ozetinin uzerine atilir.
          # JDK kullanilir; macOS kosucusundaki LibreSSL Ed25519 desteklemiyor.
          for FILE in "$EXE_FILE"; do
            [ -n "$FILE" ] || continue
            java .github/scripts/UpdateSigner.java sign "$FILE"
          done

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"

          # Release Notes iş akışı sürümü paralel olarak oluşturur; hazır olmasını bekle
          for attempt in $(seq 1 20); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            echo "Release $TAG henüz yok; bekleniyor ($attempt/20)"
            sleep 15
          done

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG için bir sürüm bulunamadı, kurulum dosyası eklenemedi"
            exit 1
          fi

          gh release upload "$TAG" "$EXE_FILE" ${EXE_FILE}.sig --repo "$GITHUB_REPOSITORY" --clobber 2>/dev/null || gh release upload "$TAG" "$EXE_FILE" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Eklendi: $EXE_FILE -> $TAG"
