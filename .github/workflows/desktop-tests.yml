name: Desktop Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run desktop tests
        run: ./gradlew :composeApp:desktopTest --stacktrace
